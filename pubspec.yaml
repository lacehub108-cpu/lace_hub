name: lace_hub
description: "Lace Hub - Cross-platform mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.5.4'

dependencies:
  flutter:
    sdk: flutter
  
  # સ્ટેટ મેનેજમેન્ટ (State Management)
  provider: ^6.1.2
  
  # ફાયરબેઝ (Firebase)
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # અન્ય જરૂરી પેકેજીસ
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  shorebird_code_push: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml